name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: website_auditor
          MYSQL_USER: auditor
          MYSQL_PASSWORD: auditor_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        env:
          DB_URL: jdbc:mysql://localhost:3306/website_auditor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: auditor
          DB_PASSWORD: auditor_test_password
          JWT_SECRET: github-actions-test-secret-key-which-is-at-least-32-bytes-long
          JWT_ACCESS_TOKEN_EXPIRATION: 900000
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test-password
          FRONTEND_URL: http://localhost:5173
          AUDIT_ENGINE_URL: http://localhost:3001
          AUDIT_ENGINE_API_KEY: github-actions-audit-engine-test-key
        run: ./mvnw clean test


  audit-engine-test:
    name: Audit Engine Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/audit-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/audit-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: node --check src/server.js


  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - audit-engine-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Spring Boot image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: website-auditor-backend:ci

      - name: Build Audit Engine image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/audit-engine
          file: ./backend/audit-engine/Dockerfile
          push: false
          tags: website-auditor-audit-engine:ci