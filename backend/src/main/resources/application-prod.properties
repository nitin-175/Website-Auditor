# =========================================================
# Production Configuration
# =========================================================

spring.config.activate.on-profile=prod

# ---------------------------------------------------------
# Database
# ---------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# HikariCP Connection Pool
# ---------------------------------------------------------
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------
# Flyway
# ---------------------------------------------------------
spring.flyway.enabled=true

# ---------------------------------------------------------
# JWT
# ---------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}

# ---------------------------------------------------------
# Mail
# ---------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# ---------------------------------------------------------
# Frontend
# ---------------------------------------------------------
app.frontend.url=${FRONTEND_URL}

# ---------------------------------------------------------
# Audit Engine
# ---------------------------------------------------------
audit.engine.url=${AUDIT_ENGINE_URL}
audit.engine.api-key=${AUDIT_ENGINE_API_KEY}

# ---------------------------------------------------------
# Actuator
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.health.mail.enabled=false

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.auditor.backend=INFO

# Reduce framework noise
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.org.apache.tomcat=WARN

# Keep security warnings/errors visible
logging.level.org.springframework.security=WARN

# Audit execution visibility
logging.level.com.auditor.backend.audit=INFO
logging.level.com.auditor.backend.scheduler=INFO

# ---------------------------------------------------------
# Rolling File Logging
# ---------------------------------------------------------
logging.file.name=${LOG_FILE:logs/website-auditor.log}

logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE_PATTERN:logs/website-auditor.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=500MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.clean-history-on-start=true

# ---------------------------------------------------------
# Server
# ---------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---------------------------------------------------------
# Error Handling
# ---------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---------------------------------------------------------
# Server Connection Protection
# ---------------------------------------------------------
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-keep-alive-requests=100

# ---------------------------------------------------------
# Request Size Boundary
# ---------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB